name: Publish 10 daily physics questions

on:
  schedule:
    # 02:30 UTC = 08:00 Asia/Kolkata. GitHub may delay scheduled runs.
    - cron: "30 2 * * *"
  workflow_dispatch:
  push:
    # Smoke-test the generator after changes without creating an endless commit loop.
    paths:
      - "scripts/publish_daily.py"
      - ".github/workflows/daily-questions.yml"

permissions:
  contents: write

concurrency:
  group: physics-daily-questions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator and exercise all rotating question families
        run: |
          python -m py_compile scripts/publish_daily.py
          python scripts/publish_daily.py --date 2026-12-01 --stdout > /dev/null
          python scripts/publish_daily.py --date 2026-12-02 --stdout > /dev/null
          python scripts/publish_daily.py --date 2026-12-03 --stdout > /dev/null

      - name: Generate today's 10 worked questions
        run: python scripts/publish_daily.py

      - name: Commit only new dated question sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions/
          if git diff --cached --quiet; then
            echo "Already published for today's IST date."
          else
            git commit -m "questions: publish 10 original physics problems for $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
